[project]
name = "progimage"
version = "0.1.0"
description = "ProgImage - an API-only image storage service."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "alembic>=1.20.1",
]

[project.optional-dependencies]
s3 = [
    "boto3>=1.35",
]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",
]
lint = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, no I/O, fakes only",
    "integration: real filesystem / DI wiring, in-process",
    "e2e: real uvicorn server over HTTP",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# The top-level ./alembic folder (env + versions) would otherwise make ruff treat the alembic package as first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.14"
packages = ["app"]
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "boto3"
ignore_missing_imports = true  # optional `s3` extra; boto3 ships no type stubs
